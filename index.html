                const matched = nums.filter(n => baseNums.includes(n));
                if (matched.length >= minMatch) {
                    const next = (r + 1 < baseRound) ? getWinning(r + 1) : null;
                    let winMatchCount = 0;
                    if (winData) winMatchCount = nums.filter(n => winData.main.includes(n)).length;
                    result.push({
                        round: r, nums, bonus: row[7], matched, matchCount: matched.length,
                        nextNums: next ? next.main : [], nextBonus: next ? next.bonus : null,
                        winMatchCount
                    });
                }
            }
            result.sort((a, b) => b.winMatchCount - a.winMatchCount || b.matchCount - a.matchCount);
            return { similar: result.slice(0, topN), prevNums: baseNums };
        }

        // ========================================================================
        // ★★★ calcFreq (거리 가중치 없음 - 단순 합산) ★★★
        // ========================================================================
        function calcFreqSimple(similar) {
            const f = {};
            for (let i = 1; i <= 45; i++) f[i] = 0;
            
            for (const s of similar) {
                for (const n of s.nextNums) {
                    f[n] = (f[n] || 0) + 1;
                }
                if (s.nextBonus !== null) {
                    f[s.nextBonus] = (f[s.nextBonus] || 0) + 0.5;
                }
                for (const n of s.nums) {
                    f[n] = (f[n] || 0) + 1;
                }
                if (s.bonus !== null) {
                    f[s.bonus] = (f[s.bonus] || 0) + 0.5;
                }
            }
            return f;
        }

        // ========================================================================
        // ★★★ calcFreq (거리 가중치 적용 - 9수 분석용) ★★★
        // ========================================================================
        function calcFreqWeighted(similar, baseRound) {
            const f = {};
            for (let i = 1; i <= 45; i++) f[i] = 0;
            
            for (const s of similar) {
                const roundDiff = baseRound - s.round;
                const recencyWeight = 1 + (1 / Math.max(1, roundDiff * 0.02));
                
                for (const n of s.nextNums) {
                    f[n] = (f[n] || 0) + (1 * recencyWeight);
                }
                if (s.nextBonus !== null) {
                    f[s.nextBonus] = (f[s.nextBonus] || 0) + (0.5 * recencyWeight);
                }
                for (const n of s.nums) {
                    f[n] = (f[n] || 0) + (1 * recencyWeight);
                }
                if (s.bonus !== null) {
                    f[s.bonus] = (f[s.bonus] || 0) + (0.5 * recencyWeight);
                }
            }
            return f;
        }

        function getUnifiedScore(n) {
            let s = 0;
            if (globalIntersectionMap[n]) s += 20;
            if (lastBonusIntersection.includes(n)) s += 10;
            if (activeFreq2.includes(n)) s += 25;
            if (oldNextFreq2.includes(n)) s += 10;
            if (topNumsAll.includes(n)) s += 30;
            s += (globalFreqData[n] || 0) * 0.2;
            return s;
        }

                const weight = s.matchCount;
                for (const n of s.nextNums) {
                    predCount[n] = (predCount[n] || 0) + 1;
                    let score = weight;
                    if (freq[n]) score += freq[n] * 0.8;
                    if (bonusIntersection.includes(n)) score += 2.0;
                    predScore[n] = (predScore[n] || 0) + score;
                }
            }
            const topPred = Object.entries(predScore)
                .sort((a,b) => b[1] - a[1])
                .slice(0, 10)
                .map(([num, score]) => ({ num: parseInt(num), score: Math.round(score * 10) / 10, count: predCount[num] || 0 }));
            const topPredNums = topPred.map(item => item.num);

            const basePool = Object.keys(topFreq).filter(k => topFreq[k] >= 2).map(Number);
            const oneHit = Object.keys(topFreq).filter(k => topFreq[k] === 1).map(Number);
            const scoredOne = oneHit.map(n => {
                let score = 0;
                if (bonusIntersection.includes(n)) score += 3;
                if (topPredNums.includes(n)) score += 2;
                if (topNextFreq[n] > 0) score += 1;
                if (freq[n] >= 5) score += 1;
                return { num: n, score };
            });
            scoredOne.sort((a,b) => b.score - a.score);
            let finalPool = [...basePool];
            for (const item of scoredOne) {
                if (finalPool.length >= 20) break;
                if (!finalPool.includes(item.num)) finalPool.push(item.num);
            }
            finalPool.sort((a, b) => (freq[b] || 0) - (freq[a] || 0));

            const tInterMap = {};
            const tInter = finalPool.filter(n => topPredNums.includes(n) && bonusIntersection.includes(n));
            for (const n of tInter) tInterMap[n] = true;

            const tierMap = {1:[],2:[],3:[],4:[],5:[]};
            finalPool.forEach(n => {
                const isInter = tInterMap[n] || false;
                const isTop10 = topPredNums.includes(n);
                if (isInter && isTop10) tierMap[1].push(n);
                else if (isInter) tierMap[2].push(n);
                else if (isTop10) tierMap[3].push(n);
                else tierMap[4].push(n);
            });
            const scoreFn = (n) => {
                let s = (freq[n] || 0) * 2;
                if (tInterMap[n]) s += 20;
                if (topPredNums.includes(n)) s += 10;
                return s;
            };
            for (let t=1; t<=4; t++) {
                tierMap[t].sort((a,b) => scoreFn(b) - scoreFn(a) || a - b);
            }
            const ranked = [...tierMap[1], ...tierMap[2], ...tierMap[3], ...tierMap[4]];
            const pick = ranked[0];
            
            cachedStrongOneNumber = pick;

            let hitMark='', hitLabel='';
            if (winData) {
                if (winData.main.includes(pick)) { hitMark=' ★'; hitLabel=' (🔥 본번호 당첨!)'; }
                else if (pick === winData.bonus) { hitMark=' ☆'; hitLabel=' (✨ 보너스 당첨!)'; }
                else hitLabel=' (검증 결과 미당첨)';
            }

            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="strong-result">
                <div class="label">💪 강력 1수 (${topN}개 유사회차, 단순 빈도 합산)</div>
                <div class="number">${pick}${hitMark}</div>
                <div class="desc">📊 Tier 1위 | 전체 랭킹: ${ranked.slice(0,10).map(n=>n).join(', ')}</div>
                <div style="margin-top:8px; font-size:13px; color:#888;">
                    🔹 Tier1 (교집합+예측): ${tierMap[1].join(', ')||'없음'}<br>
                    🔸 Tier2 (교집합): ${tierMap[2].join(', ')||'없음'}<br>
                    🔹 Tier3 (예측): ${tierMap[3].join(', ')||'없음'}
                </div>
                ${winData ? `<div style="margin-top:5px; color:${hitMark ? '#2ecc71' : '#aaa'}; font-weight:bold;">${hitLabel}</div>` : ''}
                <div class="source">📅 기준 회차: ${base}회</div>
            </div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 6. 강력 5수
        // ========================================================================
        function recommendStrong5() {
            if (!similarData) {
                alert('⚠️ 먼저 "전체 분석 실행"을 해주세요.');
                return;
            }
            const top9 = lastTop9;
            if (!top9 || top9.length === 0) {
                alert('⚠️ 9수 데이터가 없습니다. 전체 분석을 실행하세요.');
                return;
            }
            const sorted = [...top9].sort((a, b) => getUnifiedScore(b) - getUnifiedScore(a));
            const strong5 = sorted.slice(0, 5);
            lastStrong5 = strong5;
            const scoreInfo = strong5.map(n => `${n}(${Math.round(getUnifiedScore(n))}점)`).join(', ');

            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="strong5-result">
                <div class="label">💪 강력 5수 (데이터 기반 통합 점수)</div>
                <div style="margin-bottom:10px; font-size:13px; color:#888;">
                    📊 9수: ${top9.join(', ')}<br>
                    📈 통합 점수 기준 TOP 5: ${scoreInfo}
                </div>
                <div style="display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:10px 0;">
                    ${strong5.map(num => {
                        let hitMark='', numClass='';
                        if (winData) {
                            if (winData.main.includes(num)) { hitMark=' ★'; numClass='hit'; }
                            else if (num === winData.bonus) { hitMark=' ☆'; numClass='bonus'; }
                        }
                        return `<span class="collected-item ${numClass}">
                            <span class="num">${num}${hitMark}</span>
                            <span class="freq">(${Math.round(getUnifiedScore(num))}점)</span>
                        </span>`;
                    }).join('')}
                </div>
                <div class="source">📅 기준 회차: ${document.getElementById('baseRound').value}회</div>
            </div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 7. 9수 압축
        // ========================================================================
        function optimizeNine() {
            if (!similarData) {
                alert('⚠️ 먼저 "전체 분석 실행"을 해주세요.');
                return;
            }
            const top9 = lastTop9;
            if (!top9 || top9.length === 0) {
                alert('⚠️ 9수 데이터가 없습니다.');
                return;
            }
            let hitMain=[], hitBonus=[];
            if (winData) {
                top9.forEach(n => {
                    if (winData.main.includes(n)) hitMain.push(n);
                    else if (n === winData.bonus) hitBonus.push(n);
                });
            }
            const totalHit = hitMain.length + (hitBonus.length ? 1 : 0);
            const isGoal = totalHit >= 3;
            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="optimize-result" style="border-color: ${isGoal ? '#2ecc71' : '#e74c3c'};">
                <div class="label" style="color:#ffd700; font-size:18px; font-weight:bold;">🎯 9수 압축 결과</div>
                <div style="font-size:13px; color:#88ccff;">📌 구성: ③번 독자 6개 + ③∩예측 3개</div>
                <div class="number-list">${top9.map(n => {
                    let color='#fff', mark='';
                    if (winData) {
                        if (winData.main.includes(n)) { color='#2ecc71'; mark='★'; }
                        else if (n === winData.bonus) { color='#ff6b6b'; mark='☆'; }
                    }
                    return `<span style="color:${color};">${n}${mark}</span>`;
                }).join('')}</div>
                <div class="desc">📊 본번호: ${hitMain.length}개 (${hitMain.join(', ')||'없음'})${hitBonus.length ? ` | 보너스: ${hitBonus.join(', ')}` : ''}</div>
                <div style="font-size:24px; font-weight:bold; color:${isGoal?'#2ecc71':'#e74c3c'};">✅ 총 ${totalHit}개 적중 ${isGoal ? '🎉 목표 달성!' : '😅 미달'}</div>
                <div class="source">📌 9수 유사회차: ${currentTopN}개 | 기준 회차: ${document.getElementById('baseRound').value}회</div>
            </div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 8. 강력5수 포함 조합
        // ========================================================================
        function generateGungHapCombos() {
            if (!similarData) {
                alert('⚠️ 먼저 "전체 분석 실행"을 해주세요.');
                return;
            }
            const top9 = lastTop9;
            if (!top9 || top9.length === 0) return;
            const sorted = [...top9].sort((a, b) => getUnifiedScore(b) - getUnifiedScore(a));
            const strong5 = sorted.slice(0, 5);
            const rest = top9.filter(n => !strong5.includes(n));
            if (rest.length < 1) { alert('⚠️ 나머지 풀 부족'); return; }

            const combos = [];
            const used = new Set();
            for (let i = 0; i < 10 && i < rest.length; i++) {
                const combo = [...strong5, rest[i % rest.length]];
                combo.sort((a,b) => a - b);
                const key = combo.join(',');
                if (!used.has(key)) { used.add(key); combos.push(combo); }
            }
            while (combos.length < 10 && rest.length > 0) {
                const combo = [...strong5, rest[combos.length % rest.length]];
                combo.sort((a,b) => a - b);
                const key = combo.join(',');
                if (!used.has(key)) { used.add(key); combos.push(combo); }
            }

            const win = winData;
            const winMain = win ? win.main : [];
            const winBonus = win ? win.bonus : null;

            function getRankLabel(matchCount, hasBonus) {
                if (matchCount === 6) return '🏆 1등!!!';
                if (matchCount === 5 && hasBonus) return '🥈 2등!!';
                if (matchCount === 5) return '🥉 3등!';
                if (matchCount === 4) return '🎯 4등!';
                if (matchCount === 3 && hasBonus) return '✅ 5등+보너스!';
                if (matchCount === 3) return '✅ 5등!';
                return `${matchCount}개`;
            }

            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="section-title">🧩 강력5수 포함 조합 (9수 기반)</div>`;
            html += `<div style="margin-bottom:10px; font-size:13px; color:#888;">
                🔥 강력5수: <strong>${strong5.join(', ')}</strong><br>
                📊 9수: ${top9.join(', ')}
            </div>`;
            html += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">`;
            combos.slice(0,10).forEach((c, i) => {
                const matchMain = c.filter(n => winMain.includes(n));
                const matchBonus = c.filter(n => n === winBonus);
                const matchCount = matchMain.length;
                const hasBonus = matchBonus.length > 0;
                const rankLabel = getRankLabel(matchCount, hasBonus);

                const display = c.map(n => {
                    if (winMain.includes(n)) return `<span style="color:#2ecc71; font-weight:bold;">${n}★</span>`;
                    else if (n === winBonus) return `<span style="color:#ff6b6b; font-weight:bold;">${n}☆</span>`;
                    else if (strong5.includes(n)) return `<span style="color:#ffd700; font-weight:bold;">${n}🔥</span>`;
                    return n;
                }).join(' ');

                html += `<div class="combo-box" style="border-color:#e67e22;">
                    <span style="color:#e67e22; font-weight:bold; margin-right:8px;">#${i+1}</span>
                    ${display}
                    <span style="margin-left:10px; font-size:12px; color:#aaa;">${rankLabel}</span>
                </div>`;
            });
            html += `</div>`;
            html += `<div class="source" style="margin-top:10px;">📅 기준 회차: ${document.getElementById('baseRound').value}회</div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // ★★★ 9. 하이브리드 10조합 (강력1수 결과를 고정A로 사용) ★★★
        // ========================================================================
        function runHybrid() {
            if (!lastTop9 || lastTop9.length < 9 || !lastStrong5 || lastStrong5.length < 2) {
                alert("먼저 [전체 분석 실행]을 통해 9수와 강력 5수를 생성해주세요!");
                return;
            }

            const fixedA = getStrongOneNumber();
            if (!fixedA) {
                alert("강력 1수 분석에 실패했습니다. 먼저 [강력 1수] 버튼을 실행해주세요.");
                return;
            }
            
            const bCandidates = lastStrong5.filter(n => n !== fixedA);
            if (bCandidates.length === 0) {
                alert("B고정수 후보가 없습니다.");
                return;
            }
            
            const uniqueCombinations = new Set();
            let loopGuard = 0;
            
            while (uniqueCombinations.size < 10 && loopGuard < 2000) {
                loopGuard++;
                
                const currentFixedB = bCandidates[Math.floor(Math.random() * bCandidates.length)];
                const remainingTop9 = lastTop9.filter(n => n !== fixedA && n !== currentFixedB);
                
                const shuffled = [...remainingTop9].sort(() => Math.random() - 0.5);
                const picked = shuffled.slice(0, 4);
                
                const combo = [fixedA, currentFixedB, ...picked].sort((a, b) => a - b);
                uniqueCombinations.add(combo.join(','));
            }
            
            const finalCombos = Array.from(uniqueCombinations).map(str => str.split(',').map(Number));
            renderHybridResults(fixedA, finalCombos);
        }

        // ========================================================================
        // ★★★ 하이브리드 결과 렌더링 ★★★
        // ========================================================================
        function renderHybridResults(fixedA, combos) {
            const win = winData;
            const winMain = win ? win.main : [];
            const winBonus = win ? win.bonus : null;
            
            const strong5 = lastStrong5 || [];
            const top9 = lastTop9 || [];
            
            function getRankLabel(matchCount, hasBonus) {
                if (matchCount === 6) return '🏆 1등!!!';
                if (matchCount === 5 && hasBonus) return '🥈 2등!! (5+보너스)';
                if (matchCount === 5) return '🥉 3등! (5개)';
                if (matchCount === 4 && hasBonus) return '🎯 4등! (4개+보너스)';
                if (matchCount === 4) return '🎯 4등! (4개)';
                if (matchCount === 3 && hasBonus) return '✅ 5등+보너스!';
                if (matchCount === 3) return '✅ 5등!';
                if (matchCount === 2 && hasBonus) return '💫 2개+보너스';
                return `${matchCount}개`;
            }
            
            function getRankColor(matchCount, hasBonus) {
                if (matchCount >= 5) return '#ffd700';
                if (matchCount === 4) return '#00b894';
                if (matchCount === 3) return '#2ecc71';
                if (matchCount === 2 && hasBonus) return '#888';
                return '#555';
            }
            
            const fiveOrMore = combos.filter(c => {
                const hit = c.filter(n => winMain.includes(n)).length;
                return hit >= 3;
            });
            
            const strongHit = strong5.filter(n => winMain.includes(n) || n === winBonus);
            const nineHitMain = top9.filter(n => winMain.includes(n));
            
            const fixedAHit = winMain.includes(fixedA) ? '★ 본번호' : (fixedA === winBonus ? '☆ 보너스' : '미당첨');
            
            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="hybrid-result-box">
                <div class="label-title">🤝 하이브리드 10조합</div>
                <div class="info-line" style="text-align:left; padding:10px; background:#222; border-radius:8px; margin-bottom:15px;">
                    <div>🔒 <strong>고정A</strong> (강력1수 1위): <span style="color:#e74c3c; font-weight:bold; font-size:18px;">${fixedA}</span> ${fixedAHit}</div>
                    <div>🔄 <strong>고정B</strong>: 강력5수 중 <span style="color:#e67e22; font-weight:bold;">유동적 선택</span> (매 조합 변경)</div>
                    <div>📊 <strong>9수</strong>: ${top9.join(', ')}</div>
                    <div>🔥 <strong>강력5수</strong>: ${strong5.join(', ')} (당첨 ${strongHit.length}개)</div>
                    <div>📌 9수 중 당첨번호: <span style="color:#2ecc71; font-weight:bold;">${nineHitMain.join(', ') || '없음'}</span></div>
                    <div style="font-size:12px; color:#888; margin-top:5px;">💡 나머지 4자리는 9수 내에서 랜덤 선택 (강력5수 번호도 재등장 가능)</div>
                </div>
                <div class="grid-combos">
                    ${combos.slice(0,10).map((c, i) => {
                        const matchMain = c.filter(n => winMain.includes(n));
                        const matchBonus = c.filter(n => n === winBonus);
                        const matchCount = matchMain.length;
                        const hasBonus = matchBonus.length > 0;
                        const rankLabel = getRankLabel(matchCount, hasBonus);
                        const rankColor = getRankColor(matchCount, hasBonus);
                        const strongCount = c.filter(n => strong5.includes(n)).length;
                        
                        return `<div class="combo-item">
                            <span style="color:#ffd700; font-weight:bold;">#${i+1}</span>
                            <span style="color:#888; font-size:11px; margin-right:8px;">[강력${strongCount}개]</span>
                            ${c.map(n => {
                                if (winMain.includes(n)) return `<span style="color:#2ecc71; font-weight:bold;">${n}★</span>`;
                                else if (n === winBonus) return `<span style="color:#ff6b6b; font-weight:bold;">${n}☆</span>`;
                                else if (n === fixedA) return `<span class="fixed-num">${n}</span>`;
                                else if (strong5.includes(n)) return `<span class="strong-num">${n}</span>`;
                                return n;
                            }).join(' ')}
                            <span style="color:${rankColor}; margin-left:10px; font-size:13px; font-weight:bold;">${rankLabel}</span>
                        </div>`;
                    }).join('')}
                </div>
                <div style="margin-top:15px; padding:10px; background:#222; border-radius:8px; text-align:center; color:#aaa; font-size:14px;">
                    📈 총 ${combos.length}개 조합 중 <span style="color:#2ecc71;">${fiveOrMore.length}개</span>가 5등 이상 당첨!
                </div>
                <div class="source" style="margin-top:10px;">📅 기준 회차: ${document.getElementById('baseRound').value}회 | 고정A = 강력1수 1위 (단순 빈도)</div>
            </div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 10. 리셋
        // ========================================================================
        function resetAll() {
            document.getElementById('resultArea').innerHTML = '<div class="loading">📊 [분석 실행] 버튼을 눌러 모든 분석 정보를 확인하세요.</div>';
            similarData = null; winData = null; activeFreq2 = []; oldNextFreq2 = []; globalFreqData = {};
            topNumsAll = []; lastTopPred = []; lastBonusIntersection = []; lastTop9 = []; lastStrong5 = [];
            globalIntersectionMap = {}; lastFullAnalysis = null;
            cachedStrongOneNumber = null;
        }

        // ========================================================================
        // 슬라이더 & 초기화
        // ========================================================================
        document.getElementById('topCount').addEventListener('input', function() {
            document.getElementById('topCountDisplay').textContent = this.value;
        });
        document.getElementById('topCountOne').addEventListener('input', function() {
            document.getElementById('topCountOneDisplay').textContent = this.value;
        });

        window.onload = function() {
            document.getElementById('baseRound').value = 1234;
            document.getElementById('topCount').value = 6;
            document.getElementById('topCountOne').value = 3;
            document.getElementById('topCountDisplay').textContent = 6;
            document.getElementById('topCountOneDisplay').textContent = 3;
            runFullAnalysis();
        };
    </script>
</body>
