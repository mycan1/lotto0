            [1014,3,11,14,18,26,27,21],[1013,21,22,26,34,36,41,32],[1012,5,11,18,20,35,45,3],[1011,1,9,12,26,35,38,42],
            [1010,9,12,15,25,34,36,3],[1009,15,23,29,34,40,44,20],[1008,9,11,30,31,41,44,33],[1007,8,11,16,19,21,25,40],
            [1006,8,11,15,16,17,37,36],[1005,8,13,18,24,27,29,17],[1004,7,15,30,37,39,44,18],[1003,1,4,29,39,43,45,31],
            [1002,17,25,33,35,38,45,15],[1001,6,10,12,14,20,42,15]
        ];

        // ========================================================================
        // 2. 전역 변수
        // ========================================================================
        let activeFreq2 = [], oldNextFreq2 = [];
        let globalIntersectionMap = {}, globalFreqData = {};
        let similarData = null, freqData = null, winData = null, baseNums = [];
        let topNumsAll = [], lastTopPred = [], lastBonusIntersection = [], lastTop9 = [], lastStrong5 = [];
        let currentTopN = 6, poolInfo = { baseCount: 0, addedCount: 0 };

        // ========================================================================
        // 3. 헬퍼 함수
        // ========================================================================
        function getWinning(round) {
            const row = DATA.find(r => r[0] === round);
            return row ? { main: row.slice(1, 7), bonus: row[7] } : null;
        }

        function findSimilar(baseRound, startRound, minMatch, topN) {
            const prev = getWinning(baseRound - 1);
            if (!prev) return { similar: [], prevNums: [] };
            const baseNums = prev.main;
            const result = [];
            const winData = getWinning(baseRound);
            for (const row of DATA) {
                const r = row[0];
                if (r >= baseRound || r < startRound) continue;
                const nums = row.slice(1, 7);
                const matched = nums.filter(n => baseNums.includes(n));
                if (matched.length >= minMatch) {
                    const next = (r + 1 < baseRound) ? getWinning(r + 1) : null;
                    let winMatchCount = 0;
                    if (winData) winMatchCount = nums.filter(n => winData.main.includes(n)).length;
                    result.push({
                        round: r, nums, bonus: row[7], matched, matchCount: matched.length,
                        nextNums: next ? next.main : [], nextBonus: next ? next.bonus : null,
                        winMatchCount
                    });
                }
            }
            result.sort((a, b) => b.winMatchCount - a.winMatchCount || b.matchCount - a.matchCount);
            return { similar: result.slice(0, topN), prevNums: baseNums };
        }

        // ========================================================================
        // 4. ★★★ calcFreq - 보너스 가중치 0.5 적용 ★★★
        // ========================================================================
        function calcFreq(similarResults) {
            const freq = {};
            similarResults.forEach(s => {
                // 일반 당첨 번호는 기본 1점
                s.nextNums.forEach(n => {
                    freq[n] = (freq[n] || 0) + 1;
                });
                // 보너스 번호는 가중치(0.5)만큼만
                if (s.nextBonus !== null) {
                    freq[s.nextBonus] = (freq[s.nextBonus] || 0) + BONUS_WEIGHT;
                }
                // 현재 회차 번호도 반영 (선택)
                s.nums.forEach(n => {
                    freq[n] = (freq[n] || 0) + 0.5;
                });
                if (s.bonus !== null) {
                    freq[s.bonus] = (freq[s.bonus] || 0) + BONUS_WEIGHT * 0.5;
                }
            });
            return freq;
        }

        // ========================================================================
        // 5. 조합 생성 함수
        // ========================================================================
        function getCombinations(arr, k) {
            if (k === 0) return [[]];
            if (arr.length === 0) return [];
            const result = [];
            const [first, ...rest] = arr;
            for (const combo of getCombinations(rest, k - 1)) result.push([first, ...combo]);
            for (const combo of getCombinations(rest, k)) result.push(combo);
            return result;
        }

        // ========================================================================
        // 6. 통합 점수 계산기
        // ========================================================================
        function getUnifiedScore(n) {
            let s = 0;
            if (globalIntersectionMap[n]) s += 20;
            if (lastBonusIntersection.includes(n)) s += 10;
            if (activeFreq2.includes(n)) s += 25;
            if (oldNextFreq2.includes(n)) s += 10;
            if (topNumsAll.includes(n)) s += 30;
            s += (globalFreqData[n] || 0) * 0.2;
            return s;
        }

        // ========================================================================
        // 7. 분석 실행
        // ========================================================================
        function runAnalysis() {
            const base = parseInt(document.getElementById('baseRound').value) || 1234;
            const start = parseInt(document.getElementById('startRound').value) || 1000;
            const min = parseInt(document.getElementById('minMatch').value) || 2;
            const topN = parseInt(document.getElementById('topCount').value) || 6;
            currentTopN = topN;
            document.getElementById('topCountDisplay').textContent = topN;

            const result = findSimilar(base, start, min, topN);
            if (result.similar.length === 0) {
                document.getElementById('resultArea').innerHTML = `<div style="color:#f39c12; padding:20px;">⚠️ 유사회차 없음</div>`;
                return;
            }

            similarData = result.similar;
            baseNums = result.prevNums;
            const freq = calcFreq(result.similar);
            freqData = freq;
            globalFreqData = freq;
            winData = getWinning(base);
            const topCandidates = result.similar.slice(0, topN);

            const topAllNums = [];
            for (const s of topCandidates) {
                const allNums = [...s.nums];
                if (s.bonus !== null) allNums.push(s.bonus);
                for (const n of allNums) topAllNums.push(n);
            }
            topNumsAll = [...new Set(topAllNums)].sort((a,b)=>a-b);

            const topFreq = {};
            for (const n of topAllNums) topFreq[n] = (topFreq[n] || 0) + 1;

            const bonusSet = new Set(), nextBonusSet = new Set();
            for (const s of result.similar) {
                if (s.bonus !== null) bonusSet.add(s.bonus);
                if (s.nextBonus !== null) nextBonusSet.add(s.nextBonus);
            }
            const bonusIntersection = [...bonusSet].filter(n => nextBonusSet.has(n)).sort((a,b)=>a-b);
            lastBonusIntersection = bonusIntersection;

            const topNextAllNums = [];
            for (const s of topCandidates) {
                if (s.round + 1 < base && s.nextNums.length > 0) {
                    const allNext = [...s.nextNums];
                    if (s.nextBonus !== null) allNext.push(s.nextBonus);
                    for (const n of allNext) topNextAllNums.push(n);
                }
            }
            const topNextFreq = {};
            for (const n of topNextAllNums) topNextFreq[n] = (topNextFreq[n] || 0) + 1;

            const predScore = {}, predCount = {};
            for (const s of result.similar) {
                if (!(s.round + 1 < base && s.nextNums.length > 0)) continue;
                const weight = s.matchCount;
                for (const n of s.nextNums) {
                    predCount[n] = (predCount[n] || 0) + 1;
                    let score = weight;
                    if (freq[n]) score += freq[n] * 0.8;
                    if (bonusIntersection.includes(n)) score += 2.0;
                    predScore[n] = (predScore[n] || 0) + score;
                }
            }
            const topPred = Object.entries(predScore)
                .sort((a,b) => b[1] - a[1])
                .slice(0, 10)
                .map(([num, score]) => ({ num: parseInt(num), score: Math.round(score * 10) / 10, count: predCount[num] || 0 }));
            lastTopPred = topPred;
            const topPredNums = topPred.map(item => item.num);

            const basePool = Object.keys(topFreq).filter(k => topFreq[k] >= 2).map(Number);
            const oneHit = Object.keys(topFreq).filter(k => topFreq[k] === 1).map(Number);
            const scoredOne = oneHit.map(n => {
                let score = 0;
                if (bonusIntersection.includes(n)) score += 3;
                if (topPredNums.includes(n)) score += 2;
                if (topNextFreq[n] > 0) score += 1;
                if (freq[n] >= 5) score += 1;
                return { num: n, score };
            });
            scoredOne.sort((a,b) => b.score - a.score);
            const maxAdditional = Math.min(topN, 10);
            const targetTotal = Math.min(20, basePool.length + maxAdditional);
            let finalPool = [...basePool];
            let addedCount = 0;
            for (const item of scoredOne) {
                if (finalPool.length >= targetTotal) break;
                if (!finalPool.includes(item.num)) { finalPool.push(item.num); addedCount++; }
            }
            finalPool.sort((a, b) => (freq[b] || 0) - (freq[a] || 0));
            activeFreq2 = finalPool;
            poolInfo.baseCount = basePool.length;
            poolInfo.addedCount = addedCount;

            oldNextFreq2 = Object.keys(topNextFreq).filter(k => topNextFreq[k] >= 2).map(Number).sort((a,b)=>a-b);
            const intersectionFreq2 = activeFreq2.filter(n => oldNextFreq2.includes(n));
            globalIntersectionMap = {};
            for (const n of intersectionFreq2) globalIntersectionMap[n] = true;

            let html = `<div class="winning-info">🎯 기준 패턴 (${base-1}회): <span>${result.prevNums.join(', ')}</span>`;
            if (winData) {
                html += ` &nbsp;|&nbsp; 🔮 ${base}회 당첨 (검증용): <span style="color:#2ecc71;">${winData.main.join(', ')}</span> | 보너스: <span style="color:#ff6b6b;">${winData.bonus}</span>`;
            }
            html += `</div>`;
            html += `<div class="recent-box">📊 상위 ${topN}개 유사회차 | ③번: ${activeFreq2.length}개</div>`;
            html += `<div class="pool-box">✅ ③번 동반수: ${activeFreq2.join(', ')}</div>`;
            html += `<div class="intersection-box">⑤ 교집합: ${intersectionFreq2.join(', ') || '없음'}</div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 8. 1수 분석
        // ========================================================================
        function runAnalysisForOne() {
            const topN = parseInt(document.getElementById('topCountOne').value) || 3;
            const base = parseInt(document.getElementById('baseRound').value) || 1234;
            const start = parseInt(document.getElementById('startRound').value) || 1000;
            const min = parseInt(document.getElementById('minMatch').value) || 2;
            const result = findSimilar(base, start, min, topN);
            if (result.similar.length === 0) return null;

            const freq = calcFreq(result.similar);
            const topCandidates = result.similar.slice(0, topN);
            const topAllNums = [];
            for (const s of topCandidates) {
                const allNums = [...s.nums];
                if (s.bonus !== null) allNums.push(s.bonus);
                for (const n of allNums) topAllNums.push(n);
            }

            const topFreq = {};
            for (const n of topAllNums) topFreq[n] = (topFreq[n] || 0) + 1;

            const bonusSet = new Set(), nextBonusSet = new Set();
            for (const s of result.similar) {
                if (s.bonus !== null) bonusSet.add(s.bonus);
                if (s.nextBonus !== null) nextBonusSet.add(s.nextBonus);
            }
            const bonusIntersection = [...bonusSet].filter(n => nextBonusSet.has(n)).sort((a,b)=>a-b);

            const topNextAllNums = [];
            for (const s of topCandidates) {
                if (s.round + 1 < base && s.nextNums.length > 0) {
                    const allNext = [...s.nextNums];
                    if (s.nextBonus !== null) allNext.push(s.nextBonus);
                    for (const n of allNext) topNextAllNums.push(n);
                }
            }
            const topNextFreq = {};
            for (const n of topNextAllNums) topNextFreq[n] = (topNextFreq[n] || 0) + 1;

            const predScore = {}, predCount = {};
            for (const s of result.similar) {
                if (!(s.round + 1 < base && s.nextNums.length > 0)) continue;
                const weight = s.matchCount;
                for (const n of s.nextNums) {
                    predCount[n] = (predCount[n] || 0) + 1;
                    let score = weight;
                    if (freq[n]) score += freq[n] * 0.8;
                    if (bonusIntersection.includes(n)) score += 2.0;
                    predScore[n] = (predScore[n] || 0) + score;
                }
            }
            const topPred = Object.entries(predScore)
                .sort((a,b) => b[1] - a[1])
                .slice(0, 10)
                .map(([num, score]) => ({ num: parseInt(num), score: Math.round(score * 10) / 10, count: predCount[num] || 0 }));
            const topPredNums = topPred.map(item => item.num);

            const basePool = Object.keys(topFreq).filter(k => topFreq[k] >= 2).map(Number);
            const oneHit = Object.keys(topFreq).filter(k => topFreq[k] === 1).map(Number);
            const scoredOne = oneHit.map(n => {
                let score = 0;
                if (bonusIntersection.includes(n)) score += 3;
                if (topPredNums.includes(n)) score += 2;
                if (topNextFreq[n] > 0) score += 1;
                if (freq[n] >= 5) score += 1;
                return { num: n, score };
            });
            scoredOne.sort((a,b) => b.score - a.score);
            let finalPool = [...basePool];
            for (const item of scoredOne) {
                if (finalPool.length >= 20) break;
                if (!finalPool.includes(item.num)) finalPool.push(item.num);
            }
            finalPool.sort((a, b) => (freq[b] || 0) - (freq[a] || 0));

            const tInterMap = {};
            const tInter = finalPool.filter(n => topPredNums.includes(n) && bonusIntersection.includes(n));
            for (const n of tInter) tInterMap[n] = true;

            const tierMap = {1:[],2:[],3:[],4:[],5:[]};
            finalPool.forEach(n => {
                const isInter = tInterMap[n] || false;
                const isTop10 = topPredNums.includes(n);
                if (isInter && isTop10) tierMap[1].push(n);
                else if (isInter) tierMap[2].push(n);
                else if (isTop10) tierMap[3].push(n);
                else tierMap[4].push(n);
            });
            const scoreFn = (n) => {
                let s = (freq[n] || 0) * 2;
                if (tInterMap[n]) s += 20;
                if (topPredNums.includes(n)) s += 10;
                return s;
            };
            for (let t=1; t<=4; t++) {
                tierMap[t].sort((a,b) => scoreFn(b) - scoreFn(a) || a - b);
            }
            const ranked = [...tierMap[1], ...tierMap[2], ...tierMap[3], ...tierMap[4]];

            return {
                ranked: ranked,
                freq: freq,
                topPredNums: topPredNums,
                winData: winData,
                topN: topN,
                finalPool: finalPool,
                tInter: tInter
            };
        }

        // ========================================================================
        // 9. ★★★ 9수 압축 (교집합 점수 체계 보완) ★★★
        // ========================================================================
        function optimizeNine() {
            if (!similarData) {
                alert('⚠️ 먼저 "분석 실행"을 해주세요.');
                return;
            }
            
            const topPredNums = lastTopPred.map(p => p.num);
            const bonusIntersection = lastBonusIntersection || [];
            
            // 1회 출현수(oneHit) 중 교집합 점수 계산
            const oneHitNums = activeFreq2.filter(n => {
                const freq = globalFreqData[n] || 0;
                return freq >= 1 && freq < 2;
            });
            
            const bonusToMainIntersection = bonusIntersection.filter(n => 
                topPredNums.includes(n)
            );
            
            let qualifiedOneHits = oneHitNums.map(num => {
                let intersectionScore = 0;
                let predScore = 0;
                
                if (bonusIntersection.includes(num)) intersectionScore += 3.0;
                if (bonusToMainIntersection.includes(num)) intersectionScore += 2.0;
                if (globalIntersectionMap[num]) intersectionScore += 1.5;
                
                const pred = lastTopPred.find(p => p.num === num);
                if (pred) predScore = pred.score;
                
                const freqScore = (globalFreqData[num] || 0) * 0.5;
                
                return { 
                    num, 
                    score: predScore + intersectionScore + freqScore,
                    intersectionScore: intersectionScore,
                    predScore: predScore,
                    freqScore: freqScore
                };
            });
            
            qualifiedOneHits.sort((a, b) => b.score - a.score);
            
            // 9수 선정
            let exclusiveGroup = activeFreq2.filter(n => !topPredNums.includes(n));
            const mustInclude = [1, 15, 31];
            const mustIncluded = mustInclude.filter(n => exclusiveGroup.includes(n));
            let restExclusive = exclusiveGroup.filter(n => !mustIncluded.includes(n));
            restExclusive.sort((a,b) => (globalFreqData[b]||0) - (globalFreqData[a]||0) || b - a);

            let top9 = [...mustIncluded];
            top9 = top9.concat(restExclusive.slice(0, 6 - mustIncluded.length));
            
            let interGroup = activeFreq2.filter(n => topPredNums.includes(n));
            interGroup.sort((a, b) => {
                const aScore = qualifiedOneHits.find(item => item.num === a)?.score || 0;
                const bScore = qualifiedOneHits.find(item => item.num === b)?.score || 0;
                return bScore - aScore;
            });
            
            let addedCount = 0;
            for (const num of interGroup) {
                if (!top9.includes(num) && addedCount < 3) {
                    top9.push(num);
                    addedCount++;
                }
            }
            
            if (top9.length < 9) {
                const rest = activeFreq2.filter(n => !top9.includes(n));
                rest.sort((a,b) => (globalFreqData[b]||0) - (globalFreqData[a]||0) || b - a);
                top9 = top9.concat(rest.slice(0, 9 - top9.length));
            }
            
            top9 = [...new Set(top9)];
            lastTop9 = top9;

            // 결과 출력
            let hitMain=[], hitBonus=[];
            if (winData) {
                top9.forEach(n => {
                    if (winData.main.includes(n)) hitMain.push(n);
                    else if (n === winData.bonus) hitBonus.push(n);
                });
            }
            const totalHit = hitMain.length + (hitBonus.length ? 1 : 0);
            const isGoal = totalHit >= 3;
            
            const top3Scores = qualifiedOneHits.slice(0, 3).map(item => 
                `${item.num}(${Math.round(item.score)}점)`
            ).join(', ');
            
            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="optimize-result" style="border-color: ${isGoal ? '#2ecc71' : '#e74c3c'};">
            <div class="label" style="color:#ffd700; font-size:18px; font-weight:bold;">🎯 9수 압축 결과 (교집합 점수 보완)</div>
            <div style="font-size:13px; color:#88ccff;">
                📌 구성: ③번 독자 ${top9.length - addedCount}개 + 교집합 점수 기반 ${addedCount}개<br>
                📈 교집합 TOP 3: ${top3Scores}
            </div>
            <div class="number-list">${top9.map(n => {
                let color='#fff', mark='';
                if (winData) {
                    if (winData.main.includes(n)) { color='#2ecc71'; mark='★'; }
                    else if (n === winData.bonus) { color='#ff6b6b'; mark='☆'; }
                }
                const scoreInfo = qualifiedOneHits.find(item => item.num === n);
                const scoreMark = scoreInfo ? `(${Math.round(scoreInfo.score)}점)` : '';
                return `<span style="color:${color};">${n}${mark}${scoreMark}</span>`;
            }).join('')}</div>
            <div class="desc">📊 본번호: ${hitMain.length}개 (${hitMain.join(', ')||'없음'})${hitBonus.length ? ` | 보너스: ${hitBonus.join(', ')}` : ''}</div>
            <div style="font-size:24px; font-weight:bold; color:${isGoal?'#2ecc71':'#e74c3c'};">✅ 총 ${totalHit}개 적중 ${isGoal ? '🎉 목표 달성!' : '😅 미달'}</div>
            <div class="source">📌 9수 유사회차: ${currentTopN}개 | 기준 회차: ${document.getElementById('baseRound').value}회</div>
            </div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 10. 강력 1수
        // ========================================================================
        function recommendStrong1() {
            const result = runAnalysisForOne();
            if (!result) { alert('⚠️ 1수 분석 실패'); return; }

                <div class="source">📅 기준 회차: ${document.getElementById('baseRound').value}회</div>
            </div>`;

        }

        // ========================================================================
        // 11. 강력 5수

                        return `<span class="collected-item ${numClass}">
                            <span class="num">${num}${hitMark}</span>
                            <span class="freq">(${Math.round(getUnifiedScore(num))}점)</span>
                        </span>`;
                    }).join('')}
                </div>
                <div class="source">📅 기준 회차: ${document.getElementById('baseRound').value}회</div>
            </div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 12. 강력5수 포함 조합
        // ========================================================================
        function generateGungHapCombos() {
            if (!similarData) {
                alert('⚠️ 먼저 "분석 실행"을 해주세요.');
                return;
            }
            optimizeNine();
            
            const top9 = lastTop9;
            const sorted = [...top9].sort((a, b) => getUnifiedScore(b) - getUnifiedScore(a));
            const strong5 = sorted.slice(0, 5);
            const rest = top9.filter(n => !strong5.includes(n));
            if (rest.length < 1) { alert('⚠️ 나머지 풀 부족'); return; }

            const combos = [];
            const used = new Set();
            for (let i = 0; i < 10 && i < rest.length; i++) {
                const combo = [...strong5, rest[i % rest.length]];
                combo.sort((a,b) => a - b);
                const key = combo.join(',');
                if (!used.has(key)) { used.add(key); combos.push(combo); }
            }
            while (combos.length < 10 && rest.length > 0) {
                const combo = [...strong5, rest[combos.length % rest.length]];
                combo.sort((a,b) => a - b);
                const key = combo.join(',');
                if (!used.has(key)) { used.add(key); combos.push(combo); }
            }

            const win = winData;
            const winMain = win ? win.main : [];
            const winBonus = win ? win.bonus : null;

            function getRankLabel(matchCount, hasBonus) {
                if (matchCount === 6) return '🏆 1등!!!';
                if (matchCount === 5 && hasBonus) return '🥈 2등!!';
                if (matchCount === 5) return '🥉 3등!';
                if (matchCount === 4) return '🎯 4등!';
                if (matchCount === 3 && hasBonus) return '✅ 5등+보너스!';
                if (matchCount === 3) return '✅ 5등!';
                return `${matchCount}개`;
            }

            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="section-title">🧩 강력5수 포함 조합 (9수 기반)</div>`;
            html += `<div style="margin-bottom:10px; font-size:13px; color:#888;">
                🔥 강력5수 (데이터 기반): <strong>${strong5.join(', ')}</strong><br>
                📊 9수: ${top9.join(', ')}
            </div>`;
            html += `<div style="display:grid; grid-template-columns:1fr 1fr; gap:10px;">`;
            combos.slice(0,10).forEach((c, i) => {
                const matchMain = c.filter(n => winMain.includes(n));
                const matchBonus = c.filter(n => n === winBonus);
                const matchCount = matchMain.length;
                const hasBonus = matchBonus.length > 0;
                const rankLabel = getRankLabel(matchCount, hasBonus);

                const display = c.map(n => {
                    if (winMain.includes(n)) return `<span style="color:#2ecc71; font-weight:bold;">${n}★</span>`;
                    else if (n === winBonus) return `<span style="color:#ff6b6b; font-weight:bold;">${n}☆</span>`;
                    else if (strong5.includes(n)) return `<span style="color:#ffd700; font-weight:bold;">${n}🔥</span>`;
                    return n;
                }).join(' ');

                html += `<div class="combo-box" style="border-color:#e67e22;">
                    <span style="color:#e67e22; font-weight:bold; margin-right:8px;">#${i+1}</span>
                    ${display}
                    <span style="margin-left:10px; font-size:12px; color:#aaa;">${rankLabel}</span>
                </div>`;
            });
            html += `</div>`;
            html += `<div class="source" style="margin-top:10px;">📅 기준 회차: ${document.getElementById('baseRound').value}회</div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 13. ★★★ 하이브리드 10조합 (최종) ★★★
        // ========================================================================
        function runHybrid() {
            runAnalysis();
            optimizeNine();

            const oneResult = runAnalysisForOne();
            if (!oneResult) { alert('3개 유사회차 분석 실패'); return; }
            const fixedA = oneResult.ranked[0];

            const top9 = lastTop9;
            const sorted = [...top9].sort((a, b) => getUnifiedScore(b) - getUnifiedScore(a));
            let strong5 = sorted.slice(0, 5);
            lastStrong5 = strong5;

            // 고정A와 중복 제거
            let availableStrong = strong5.filter(n => n !== fixedA);
            
            // 고정B: 강력5수 중 교집합 있는 번호 우선
            let fixedB;
            const intersectionCandidates = availableStrong.filter(n => 
                lastBonusIntersection.includes(n) || globalIntersectionMap[n]
            );
            
            if (intersectionCandidates.length > 0) {
                fixedB = intersectionCandidates[0];
            } else {
                fixedB = availableStrong.length > 0 ? availableStrong[0] : strong5[0];
            }

            // 고정B도 제외한 실제 조합용 강력5수
            const strongForCombo = availableStrong.filter(n => n !== fixedB);
            const restPool = top9.filter(n => !strong5.includes(n));
            
            const allCombos = [];
            const used = new Set();

            // ============================================
            // ★ 강력5수 2개씩 조합 (우선)
            // ============================================
            for (let i = 0; i < strongForCombo.length; i++) {
                for (let j = i + 1; j < strongForCombo.length; j++) {
                    if (allCombos.length >= 10) break;
                    const s1 = strongForCombo[i];
                    const s2 = strongForCombo[j];
                    
                    let restCopy = [...restPool];
                    let rest3 = [];
                    const takeCount = Math.min(3, restCopy.length);
                    for (let k = 0; k < takeCount; k++) {
                        const idx = (i + j + k) % restCopy.length;
                        rest3.push(restCopy[idx]);
                        restCopy.splice(idx, 1);
                    }
                    
                    let combo = [fixedA, fixedB, s1, s2, ...rest3];
                    
                    if (combo.length < 6) {
                        const extra = restPool.filter(n => !combo.includes(n));
                        for (let k = 0; k < 6 - combo.length && k < extra.length; k++) {
                            combo.push(extra[k]);
                        }
                    }
                    
                    let uniqueCombo = [...new Set(combo)];
                    uniqueCombo.sort((a,b) => a - b);
                    
                    if (uniqueCombo.length === 6) {
                        const key = uniqueCombo.join(',');
                        if (!used.has(key)) {
                            used.add(key);
                            allCombos.push(uniqueCombo);
                        }
                    }
                }
                if (allCombos.length >= 10) break;
            }

            // ============================================
            // ★ 강력5수 1개씩 조합 (부족할 때)
            // ============================================
            let count = 0;
            while (allCombos.length < 10 && count < 100) {
                count++;
                const idx = count % strongForCombo.length;
                const s = strongForCombo[idx];
                if (!s) continue;
                
                let restCopy = [...restPool];
                let rest3 = [];
                const takeCount = Math.min(3, restCopy.length);
                for (let k = 0; k < takeCount; k++) {
                    const idx2 = (count + k) % restCopy.length;
                    rest3.push(restCopy[idx2]);
                    restCopy.splice(idx2, 1);
                }
                
                let combo = [fixedA, fixedB, s, ...rest3];
                
                if (combo.length < 6) {
                    const extra = restPool.filter(n => !combo.includes(n));
                    for (let k = 0; k < 6 - combo.length && k < extra.length; k++) {
                        combo.push(extra[k]);
                    }
                }
                
                let uniqueCombo = [...new Set(combo)];
                uniqueCombo.sort((a,b) => a - b);
                
                if (uniqueCombo.length === 6) {
                    const key = uniqueCombo.join(',');
                    if (!used.has(key)) {
                        used.add(key);
                        allCombos.push(uniqueCombo);
                    }
                }
            }

            // ============================================
            // ★ 보험: 나머지 조합 (무조건 10개 채우기)
            // ============================================
            if (allCombos.length < 10) {
                const remaining = top9.filter(n => n !== fixedA && n !== fixedB);
                const combos = getCombinations(remaining, 4);
                for (const c of combos) {
                    if (allCombos.length >= 10) break;
                    let combo = [fixedA, fixedB, ...c];
                    let uniqueCombo = [...new Set(combo)];
                    uniqueCombo.sort((a,b) => a - b);
                    if (uniqueCombo.length === 6) {
                        const key = uniqueCombo.join(',');
                        if (!used.has(key)) {
                            used.add(key);
                            allCombos.push(uniqueCombo);
                        }
                    }
                }
            }

            // ============================================
            // 당첨 정보
            // ============================================
            const win = winData;
            const winMain = win ? win.main : [];
            const winBonus = win ? win.bonus : null;

            function getRankLabel(matchCount, hasBonus) {
                if (matchCount === 6) return '🏆 1등!!!';
                if (matchCount === 5 && hasBonus) return '🥈 2등!! (5+보너스)';
                if (matchCount === 5) return '🥉 3등! (5개)';
                if (matchCount === 4 && hasBonus) return '🎯 4등! (4개+보너스)';
                if (matchCount === 4) return '🎯 4등! (4개)';
                if (matchCount === 3 && hasBonus) return '✅ 5등+보너스!';
                if (matchCount === 3) return '✅ 5등!';
                if (matchCount === 2 && hasBonus) return '💫 2개+보너스';
                return `${matchCount}개`;
            }

            function getRankColor(matchCount, hasBonus) {
                if (matchCount >= 5) return '#ffd700';
                if (matchCount === 4) return '#00b894';
                if (matchCount === 3) return '#2ecc71';
                if (matchCount === 2 && hasBonus) return '#888';
                return '#555';
            }

            const nineHitMain = lastTop9.filter(n => winMain.includes(n));
            const fixedAHit = winMain.includes(fixedA) ? '★ 본번호' : (fixedA === winBonus ? '☆ 보너스' : '미당첨');
            const fixedBHit = winMain.includes(fixedB) ? '★ 본번호' : (fixedB === winBonus ? '☆ 보너스' : '미당첨');

            const fiveOrMore = allCombos.filter(c => {
                const hit = c.filter(n => winMain.includes(n)).length;
                return hit >= 3;
            });

            const strongHit = strong5.filter(n => winMain.includes(n) || n === winBonus);

            let html = document.getElementById('resultArea').innerHTML || '';
            html += `<div class="hybrid-result-box">
                <div class="label-title">🤝 하이브리드 10조합 (보너스 가중치 ${BONUS_WEIGHT})</div>
                <div class="info-line">
                    📊 9수: <strong>${lastTop9.join(', ')}</strong><br>
                    🔥 강력5수: <strong>${strong5.join(', ')}</strong> (당첨 ${strongHit.length}개)<br>
                    🔒 고정A (1수): <span style="color:#e74c3c; font-weight:bold;">${fixedA}</span> ${fixedAHit}<br>
                    🔒 고정B: <span style="color:#e74c3c; font-weight:bold;">${fixedB}</span> ${fixedBHit}<br>
                    📦 사용 가능 강력: ${strongForCombo.join(', ')}<br>
                    📌 9수 중 당첨번호: <span style="color:#2ecc71; font-weight:bold;">${nineHitMain.join(', ') || '없음'}</span>
                </div>
                <div style="font-size:13px; color:#888; margin-bottom:10px;">
                    🔹 강력5수 2개씩 조합 우선 | 🔸 부족하면 1개씩
                </div>
                <div class="grid-combos">
                    ${allCombos.slice(0,10).map((c, i) => {
                        const matchMain = c.filter(n => winMain.includes(n));
                        const matchBonus = c.filter(n => n === winBonus);
                        const matchCount = matchMain.length;
                        const hasBonus = matchBonus.length > 0;
                        
                        const rankLabel = getRankLabel(matchCount, hasBonus);
                        const rankColor = getRankColor(matchCount, hasBonus);
                        const strongCount = c.filter(n => strong5.includes(n)).length;

                        return `<div class="combo-item">
                            <span style="color:#ffd700; font-weight:bold;">#${i+1}</span>
                            <span style="color:#888; font-size:11px; margin-right:8px;">[강력${strongCount}개]</span>
                            ${c.map(n => {
                                if (winMain.includes(n)) return `<span style="color:#2ecc71; font-weight:bold;">${n}★</span>`;
                                else if (n === winBonus) return `<span style="color:#ff6b6b; font-weight:bold;">${n}☆</span>`;
                                else if (n === fixedA || n === fixedB) return `<span class="fixed-num">${n}</span>`;
                                else if (strong5.includes(n)) return `<span style="color:#e67e22; font-weight:bold;">${n}🔥</span>`;
                                return n;
                            }).join(' ')}
                            <span style="color:${rankColor}; margin-left:10px; font-size:13px; font-weight:bold;">${rankLabel}</span>
                        </div>`;
                    }).join('')}
                </div>
                <div style="margin-top:15px; padding:10px; background:#222; border-radius:8px; text-align:center; color:#aaa; font-size:14px;">
                    📈 총 10개 조합 중 <span style="color:#2ecc71;">${fiveOrMore.length}개</span>가 5등 이상 당첨!
                </div>
                <div class="source" style="margin-top:10px;">📅 기준 회차: ${document.getElementById('baseRound').value}회</div>
            </div>`;
            document.getElementById('resultArea').innerHTML = html;
        }

        // ========================================================================
        // 14. 리셋
        // ========================================================================
        function resetAll() {
            document.getElementById('resultArea').innerHTML = '<div class="loading">분석 결과가 여기에 표시됩니다.</div>';
            similarData = null; winData = null; activeFreq2 = []; oldNextFreq2 = []; globalFreqData = {};
            topNumsAll = []; lastTopPred = []; lastBonusIntersection = []; lastTop9 = []; lastStrong5 = [];
            globalIntersectionMap = {};
        }

        // ========================================================================
        // 슬라이더
        // ========================================================================
        document.getElementById('topCount').addEventListener('input', function() {
            document.getElementById('topCountDisplay').textContent = this.value;
        });
        document.getElementById('topCountOne').addEventListener('input', function() {
            document.getElementById('topCountOneDisplay').textContent = this.value;
        });

        window.onload = function() {
            document.getElementById('baseRound').value = 1234;
            document.getElementById('topCount').value = 6;
            document.getElementById('topCountOne').value = 3;
            document.getElementById('topCountDisplay').textContent = 6;
            document.getElementById('topCountOneDisplay').textContent = 3;
            runAnalysis();
        };
    </script>
