<!DOCTYPE html>

    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body { background: #0a0a0a; color: #fff; font-family: 'Segoe UI', sans-serif; padding: 20px; max-width: 1100px; margin: 0 auto; }
        h1 { color: #ffd700; text-align: center; border-bottom: 3px solid #ffd700; padding-bottom: 10px; margin-bottom: 20px; }
        .filters { background: #1a1a1a; border: 2px solid #ffd700; border-radius: 15px; padding: 15px 20px; margin-bottom: 20px; display: flex; flex-wrap: wrap; gap: 15px; align-items: flex-end; }
        .filter-group { display: flex; flex-direction: column; gap: 3px; }
        .filter-group label { color: #ffd700; font-size: 12px; font-weight: bold; }
        .filter-group input, .filter-group select { padding: 6px 12px; border-radius: 8px; border: 1px solid #555; background: #2a2a2a; color: #fff; font-size: 14px; width: 100%; }
        .filter-group input[type="number"] { width: 100px; }
        button { background: #ffd700; color: #000; border: none; border-radius: 30px; padding: 8px 20px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s; }

        button.secondary { background: #555; color: #fff; }
        button.secondary:hover { background: #777; }
        .result-area { background: #1a1a1a; border: 2px solid #ffd700; border-radius: 15px; padding: 20px; margin-top: 20px; overflow-x: auto; }
        .section-title { color: #ffd700; font-size: 18px; font-weight: bold; margin: 15px 0 10px 0; }
        .winning-info { background: #2a2a2a; border-left: 4px solid #ff6b6b; padding: 10px 15px; border-radius: 8px; margin: 10px 0; }
        .winning-info span { color: #ff6b6b; font-weight: bold; font-size: 18px; }
        .info-box { background: #1a2a2a; border-left: 4px solid #3498db; padding: 8px 15px; border-radius: 8px; margin: 5px 0; font-size: 13px; color: #88ccff; }
        .pool-box { background: #1a2a1a; border: 2px solid #2ecc71; padding: 10px; border-radius: 8px; margin: 10px 0; }
        .combo-box { background: #1a2a1a; border: 1px solid #2ecc71; border-radius: 10px; padding: 10px 15px; margin: 5px 0; display: flex; flex-wrap: wrap; align-items: center; }

        .match-bonus { color: #ff6b6b; font-weight: bold; background: rgba(255,107,107,0.25); border-radius: 4px; padding: 2px 6px; }

        .badge-3 { background: #17a2b8; color: #fff; }
        .badge-4 { background: #ffd700; color: #000; }
        .badge-5 { background: #2ecc71; color: #000; }
        table { width: 100%; border-collapse: collapse; font-size: 12px; margin: 10px 0; }
        th { background: #ffd700; color: #000; padding: 6px 4px; text-align: center; }
        td { padding: 5px 4px; border-bottom: 1px solid #333; text-align: center; }
        .round-col { color: #ffd700; font-weight: bold; }
        .bonus-col { color: #ff6b6b; font-weight: bold; }
        .no-data { color: #f39c12; font-style: italic; }
        .pair-box { background: #1a1a2a; border: 2px solid #e67e22; padding: 10px 15px; border-radius: 8px; margin: 10px 0; }
        .pair-box strong { color: #e67e22; }
        .pair-item { display: inline-block; background: #333; padding: 2px 10px; border-radius: 20px; margin: 2px 4px; font-size: 14px; font-weight: bold; }
        .pair-item .freq { color: #aaa; font-size: 11px; font-weight: normal; margin-left: 2px; }
        .pair-item.hit .num { color: #2ecc71; }
        .pair-item.bonus .num { color: #ff6b6b; }

        .pair-item.bonus { background: rgba(255,107,107,0.15); border: 1px solid #ff6b6b; }

        .new-intersection-item { display: inline-block; background: #333; padding: 2px 10px; border-radius: 20px; margin: 2px 4px; font-size: 14px; font-weight: bold; }
        .new-intersection-item .freq { color: #aaa; font-size: 11px; font-weight: normal; margin-left: 2px; }
        .new-intersection-item.hit .num { color: #2ecc71; }
        .new-intersection-item.bonus .num { color: #ff6b6b; }

        .new-intersection-item.bonus { background: rgba(255,107,107,0.15); border: 1px solid #ff6b6b; }

        .recent-box { background: #1a1a2a; border: 2px solid #3498db; padding: 10px 15px; border-radius: 8px; margin: 10px 0; }
        .recent-box strong { color: #3498db; }

        .num-list .num-item.hit { color: #2ecc71; background: rgba(46,204,113,0.15); border: 1px solid #2ecc71; }
        .num-list .num-item.bonus { color: #ff6b6b; background: rgba(255,107,107,0.15); border: 1px solid #ff6b6b; }
        .num-list .num-item .freq { color: #888; font-size: 11px; font-weight: normal; margin-left: 4px; }
        .copy-btn-small { background: #3498db; color: #fff; border: none; border-radius: 12px; padding: 2px 12px; font-size: 12px; cursor: pointer; margin-left: 8px; }

        .set-calc-container .input-group .field label { color: #88ccff; font-size: 13px; font-weight: bold; }

        .set-calc-container .btn-group button { flex: 1 1 auto; min-width: 80px; }
        .set-calc-container .result-box { background: #0a0a0a; border: 1px solid #555; border-radius: 10px; padding: 15px; margin-top: 10px; min-height: 50px; font-size: 16px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }

        .set-calc-container .result-box .num-chip.bonus { color: #ff6b6b; background: rgba(255,107,107,0.2); border: 1px solid #ff6b6b; }

        .set-calc-container .legend .dot { display: inline-block; width: 12px; height: 12px; border-radius: 50%; margin-right: 4px; }
        .set-calc-container .legend .dot.green { background: #2ecc71; }

    <h1>📊 유사회차 다음회차 - 상위 6개 회차 기준</h1>

    <div class="filters">
        <div class="filter-group">
            <label>📅 기준 회차 (예측 대상)</label>
            <input type="number" id="baseRound" value="1236" min="2" max="9999" onchange="syncStartRound()">
        </div>
        <div class="filter-group">
            <label>🔢 시작 회차</label>
            <input type="number" id="startRound" value="1036" min="1" max="9999">
        </div>
        <div class="filter-group">
            <label>🎯 최소 일치 개수</label>
            <select id="minMatch">
                <option value="1" selected>1개</option>
                <option value="2">2개</option>
                <option value="3">3개</option>
            </select>
        </div>
        <div class="filter-group">
            <label>&nbsp;</label>
            <div class="btn-group">
                <button onclick="runAnalysis()">🚀 분석 실행</button>
                <button onclick="generateCombos()" style="background:#2ecc71; color:#000;">🎯 일반 조합</button>
                <button onclick="generateCombinedCombos()" style="background:#e67e22; color:#000;">🔗 합집합 조합</button>
                <button onclick="generateTopCompanionCombos()" style="background:#f39c12; color:#000;">📌 ③∩① 조합</button>
            </div>
        </div>
        <div class="filter-group">
            <label>&nbsp;</label>
            <button onclick="resetAll()" class="secondary">🗑️ 초기화</button>
        </div>
    </div>

    <!-- 집합 계산기 -->
    <div class="set-calc-container">
        <h2>🧮 집합 계산기 (A, B, C) <span style="font-size:13px; color:#888; font-weight:normal;">※ 기준 회차 입력 후 분석 실행 시 당첨번호 자동 입력</span></h2>
        <div class="input-group">
            <div class="field"><label>집합 A</label><input type="text" id="setA" value="" placeholder="예: 1,2,3"></div>
            <div class="field"><label>집합 B</label><input type="text" id="setB" value="" placeholder="예: 4,5,6"></div>
            <div class="field"><label>집합 C</label><input type="text" id="setC" value="" placeholder="예: 7,8,9"></div>
            <div class="field"><label>🎯 본번호 (녹색)</label><input type="text" id="mainNums" value="" placeholder="예: 1,3,5"></div>
            <div class="field"><label>🎯 보너스 (빨간색)</label><input type="text" id="bonusNums" value="" placeholder="예: 2,4"></div>
        </div>
        <div class="btn-group">
            <button onclick="calcUnion()">합집합</button>
            <button onclick="calcIntersection()">교집합</button>
            <button onclick="calcDifference()">차집합 (A-B-C)</button>
            <button onclick="calcSymmetricDifference()">대칭차</button>
            <button onclick="resetSetCalc()" class="secondary">초기화</button>
        </div>
        <div>
            <div class="result-box" id="setResult"><span class="placeholder">📌 결과: 여기에 표시됩니다 (본:녹색 / 보너스:빨간색)</span></div>
            <div style="margin-top:8px; display:flex; align-items:center; gap:12px; flex-wrap:wrap;">
                <button class="copy-btn" onclick="copySetResult()">📋 복사</button>
                <div class="legend"><span><span class="dot green"></span> 본번호</span><span><span class="dot red"></span> 보너스</span></div>
            </div>
        </div>
    </div>

    <div class="result-area" id="resultArea">
        <div class="loading">분석 결과가 여기에 표시됩니다.</div>
    </div>

        // ========================================================================

        let globalBottom10 = [];

        // ========================================================================

        function syncStartRound() {
            var base = parseInt(document.getElementById('baseRound').value);
            if (!isNaN(base) && base > 200) {
                document.getElementById('startRound').value = base - 200;
            } else {
                document.getElementById('startRound').value = 1;

        // ========================================================================
        // 기타 분석용 변수 / 함수
        // ========================================================================
        let top6Freq2=[], top6NextFreq2=[], similarData=null, freqData=null, top10=[], low10=[], pool=[], winData=null, baseNums=[];
        let top6FreqGlobal = {};

        function getWinning(round){ const row=DATA.find(r=>r[0]===round); return row?{main:row.slice(1,7), bonus:row[7]}:null; }
        function findSimilar(baseRound,startRound,minMatch){
            const prev=getWinning(baseRound-1); if(!prev) return {similar:[], prevNums:[]};
            const baseNums=prev.main, result=[], winData=getWinning(baseRound);
            for(const row of DATA){
                const r=row[0]; if(r>=baseRound || r<startRound) continue;
                const nums=row.slice(1,7), matched=nums.filter(n=>baseNums.includes(n));
                if(matched.length>=minMatch){
                    const next=(r+1<baseRound)?getWinning(r+1):null;
                    let winMatchCount=0; if(winData) winMatchCount=nums.filter(n=>winData.main.includes(n)).length;
                    result.push({round:r, nums, bonus:row[7], matched, matchCount:matched.length, nextNums:next?next.main:[], nextBonus:next?next.bonus:null, winMatchCount});
                }
            }
            result.sort((a,b)=>b.winMatchCount!==a.winMatchCount?b.winMatchCount-a.winMatchCount:b.matchCount-a.matchCount);
            return {similar:result, prevNums:baseNums};
        }
        function calcFreq(similar){ const f={}; for(let i=1;i<=45;i++) f[i]=0; for(const s of similar){ for(const n of s.nextNums) f[n]=(f[n]||0)+1; if(s.nextBonus!==null) f[s.nextBonus]=(f[s.nextBonus]||0)+1; for(const n of s.nums) f[n]=(f[n]||0)+1; if(s.bonus!==null) f[s.bonus]=(f[s.bonus]||0)+1; } return f; }
        function getTop(freq,n){ return Object.entries(freq).sort((a,b)=>b[1]-a[1]).slice(0,n).map(([k])=>parseInt(k)); }
        function getLow(freq,n){ return Object.entries(freq).sort((a,b)=>a[1]-b[1]).slice(0,n).map(([k])=>parseInt(k)); }
        function getAbove2(freq){ return Object.entries(freq).filter(([k,v])=>v>=2).map(([k])=>parseInt(k)).sort((a,b)=>a-b); }

        // ========================================================================
        // ★ 조합 생성 함수 (10개 풀 step 1, 20개 풀 step 6, 그 외 점수 기반)
        // ========================================================================
        function makeCombos(pool, topN = 10) {
            const n = pool.length;
            if (n === 10) {
                const sorted = [...pool].sort((a, b) => a - b);
                const combos = [];
                for (let i = 0; i < 10; i++) {
                    const combo = [];
                    for (let j = 0; j < 6; j++) {
                        combo.push(sorted[(i + j) % 10]);
                    }
                    combo.sort((a, b) => a - b);
                    combos.push(combo);
                }
                return combos;
            }
            if (n === 20) {
                const sorted = [...pool].sort((a, b) => a - b);
                const combos = [];
                for (let i = 0; i < 10; i++) {
                    const combo = [];
                    for (let j = 0; j < 6; j++) {
                        combo.push(sorted[(i * 6 + j) % 20]);
                    }
                    combo.sort((a, b) => a - b);
                    combos.push(combo);
                }
                return combos;
            }
            // 점수 기반 (기본)
            const freq = globalFreqData || {};
            function getCombinations(arr, k) {
                if (k === 0) return [[]];
                if (arr.length === 0) return [];
                const [first, ...rest] = arr;
                const withFirst = getCombinations(rest, k - 1).map(c => [first, ...c]);
                const withoutFirst = getCombinations(rest, k);
                return [...withFirst, ...withoutFirst];
            }
            const allCombos = getCombinations(pool, 6);
            const scored = allCombos.map(combo => {
                const score = combo.reduce((sum, num) => sum + (freq[num] || 0), 0);
                return { combo, score };
            });
            scored.sort((a, b) => b.score - a.score || a.combo[0] - b.combo[0]);
            const topCombos = scored.slice(0, topN).map(item => item.combo);
            while (topCombos.length < topN) {
                const shuffled = [...pool].sort(() => Math.random() - 0.5);
                const combo = shuffled.slice(0, 6).sort((a, b) => a - b);
                const key = combo.join(',');
                if (!topCombos.some(c => c.join(',') === key)) {
                    topCombos.push(combo);
                }
            }
            return topCombos;
        }

        function autoFillWinningNumbers(winData) {
            if (!winData) return;

        // ========================================================================
        // 분석 실행
        // ========================================================================
        function runAnalysis(){
            const base=parseInt(document.getElementById('baseRound').value)||1236;
            const start=parseInt(document.getElementById('startRound').value)||1036;
            const min=parseInt(document.getElementById('minMatch').value)||1;
            const result=findSimilar(base,start,min);
            if(result.similar.length===0){ document.getElementById('resultArea').innerHTML=`<div style="color:#f39c12; padding:20px; text-align:center;">⚠️ 유사회차 없음 (최소 일치 개수 ${min}개)</div>`; return; }
            similarData=result.similar; baseNums=result.prevNums; const freq=calcFreq(result.similar); freqData=freq; globalFreqData=freq; top10=getTop(freq,10); low10=getLow(freq,10); pool=getAbove2(freq); winData=getWinning(base);
            globalWinData = winData;

            autoFillWinningNumbers(winData);

            const top6=result.similar.slice(0,6);
            const top6Rounds=[], top6AllNums=[], top6NumsSet=new Set();
            for(const s of top6){ top6Rounds.push(s.round); const allNums=[...s.nums]; if(s.bonus!==null) allNums.push(s.bonus); for(const n of allNums){ top6AllNums.push(n); top6NumsSet.add(n); } }
            const top6Nums=[...top6NumsSet].sort((a,b)=>a-b);
            const top6Freq={}; for(const n of top6AllNums) top6Freq[n]=(top6Freq[n]||0)+1;
            top6FreqGlobal = top6Freq;
            top6Freq2=Object.keys(top6Freq).filter(k=>top6Freq[k]>=2).map(Number).sort((a,b)=>a-b);

            const top6NextRounds=[], top6NextAllNums=[], top6NextSet=new Set();
            for(const s of top6){ if(s.round+1<base && s.nextNums.length>0){ top6NextRounds.push(s.round+1); const allNext=[...s.nextNums]; if(s.nextBonus!==null) allNext.push(s.nextBonus); for(const n of allNext){ top6NextAllNums.push(n); top6NextSet.add(n); } } }
            const top6NextNums=[...top6NextSet].sort((a,b)=>a-b);
            const top6NextFreq={}; for(const n of top6NextAllNums) top6NextFreq[n]=(top6NextFreq[n]||0)+1;
            top6NextFreq2=Object.keys(top6NextFreq).filter(k=>top6NextFreq[k]>=2).map(Number).sort((a,b)=>a-b);
            const intersectionFreq2=top6Freq2.filter(n=>top6NextFreq2.includes(n));

            const winMain=winData?winData.main:[], winBonus=winData?winData.bonus:null;
            const hitTop6All=top6AllNums.filter(n=>winMain.includes(n)||n===winBonus);
            const hitTop6Count=hitTop6All.length, uniqueHitTop6=[...new Set(hitTop6All)].sort((a,b)=>a-b);
            const hitTop6NextAll=top6NextAllNums.filter(n=>winMain.includes(n)||n===winBonus);
            const hitTop6NextCount=hitTop6NextAll.length, uniqueHitTop6Next=[...new Set(hitTop6NextAll)].sort((a,b)=>a-b);
            const hitRateTop6=top6AllNums.length>0?(hitTop6Count/top6AllNums.length*100):0;
            const hitRateTop6Next=top6NextAllNums.length>0?(hitTop6NextCount/top6NextAllNums.length*100):0;

            // Bonus 교집합
            const bonusSet=new Set(), nextBonusSet=new Set();
            for(const s of result.similar){ if(s.bonus!==null) bonusSet.add(s.bonus); if(s.nextBonus!==null) nextBonusSet.add(s.nextBonus); }
            const bonusIntersection=[...bonusSet].filter(n=>nextBonusSet.has(n)).sort((a,b)=>a-b);

            // 예측 점수
            const predScore={}, predCount={};
            for(const s of result.similar){ if(!(s.round+1<base && s.nextNums.length>0)) continue; const weight=s.matchCount; for(const n of s.nextNums){ predCount[n]=(predCount[n]||0)+1; let score=weight; if(freq[n]) score+=freq[n]*0.8; if(bonusIntersection.includes(n)) score+=2.0; predScore[n]=(predScore[n]||0)+score; } }
            
            const topPred=Object.entries(predScore).sort((a,b)=>b[1]-a[1]).slice(0,10).map(([num,score])=>({num:parseInt(num), score:Math.round(score*10)/10, count:predCount[num]||0}));
            
            // TOP20
            const set1 = new Set(top6Nums);
            const set2 = new Set(top6NextNums);
            const set3 = new Set(top6Freq2);
            const set4 = new Set(top6NextFreq2);
            const union234 = new Set([...set2, ...set3, ...set4]);
            const inter = new Set([...union234].filter(n => set1.has(n)));
            let interArr = Array.from(inter);
            interArr.sort((a,b) => (top6FreqGlobal[b]||0) - (top6FreqGlobal[a]||0));

            let final20 = [];
            if (interArr.length >= 20) {
                final20 = interArr.slice(0,20);
            } else {
                final20 = interArr.slice();
                const fullSet = new Set([...set1, ...set2, ...set3, ...set4]);
                const rest = new Set([...fullSet].filter(n => !inter.has(n)));
                let restArr = Array.from(rest);
                restArr.sort((a,b) => (top6FreqGlobal[b]||0) - (top6FreqGlobal[a]||0));
                const need = 20 - final20.length;
                for (let i=0; i<need && i<restArr.length; i++) {
                    final20.push(restArr[i]);
                }
                if (final20.length < 20) {
                    const allNums = [];
                    for (let i=1; i<=45; i++) allNums.push(i);
                    const remaining = allNums.filter(n => !final20.includes(n));
                    remaining.sort((a,b) => (top6FreqGlobal[b]||0) - (top6FreqGlobal[a]||0));
                    for (let i=0; i<20-final20.length && i<remaining.length; i++) {
                        final20.push(remaining[i]);
                    }
                }
            }
            final20 = [...new Set(final20)];
            final20.sort((a,b) => (top6FreqGlobal[b]||0) - (top6FreqGlobal[a]||0));
            final20 = final20.slice(0,20);
            const final20Set = new Set(final20);

            // ③ ∩ ①
            const companionPool = final20.filter(n => set3.has(n));
            globalTopCompanionPool = companionPool;

            // 제외 20수
            const freqEntries = Object.entries(freqData).sort((a, b) => a[1] - b[1]);
            const exclude20Data = freqEntries.slice(0, 20).map(([num, count]) => ({ num: parseInt(num), count }));
            const exclude20Filtered = exclude20Data.filter(item => !final20Set.has(item.num));

            // (③ ∪ ②) ∩ 1 (내부용)
            const union23 = new Set([...top6Freq2, ...top6NextNums]);
            const newIntersection = top6Nums.filter(n => union23.has(n));
            newIntersection.sort((a,b) => (top6FreqGlobal[b]||0) - (top6FreqGlobal[a]||0));

            // 집중 추천 풀 10
            const targetForExclude = top6Freq2;
            const excludeCandidates = targetForExclude.map(num => {
                let score = 0;
                const pred = predScore[num] || 0;
                score += -pred * 1.0;

            excludeCandidates.sort((a,b) => b.score - a.score);
            
            let bottom10 = excludeCandidates.slice(0, 10).map(item => item.num);
            if (bottom10.length < 10) {
                const extraPool = newIntersection.filter(n => !bottom10.includes(n));
                extraPool.sort((a,b) => (top6FreqGlobal[b]||0) - (top6FreqGlobal[a]||0));
                const need = 10 - bottom10.length;
                for (let i=0; i<need && i<extraPool.length; i++) {

            // TOP10 필터링
            const filteredTopPred = topPred.filter(item => !final20Set.has(item.num));

            const removedTopPred = topPred.filter(item => final20Set.has(item.num));

            // 종합 제외 후보

            removedTopPred.forEach(item => combinedSet.add(item.num));
            exclude20Filtered.forEach(item => combinedSet.add(item.num));
            const combinedExclude = Array.from(combinedSet).sort((a,b) => a - b);
            const combinedExcludeNumbersOnly = combinedExclude.join(',');

            // 미등장 숫자
            const unionAll = new Set([...top6Nums, ...top6NextNums]);
            const missingNumbers = [];
            for (let i = 1; i <= 45; i++) {
                if (!unionAll.has(i)) missingNumbers.push(i);
            }

                return;

            const n = sorted.length;
            const combos = [];
            const usedSet = new Set();
            let i = 0;
            let attempts = 0;
            while (combos.length < 10 && attempts < 2000) {
                attempts++;
                // 기본 시작 위치는 2칸씩 이동 (i * 2)
                let start = (i * 2) % n;

                let combo = [];
                for (let j = 0; j < 6; j++) {
                    combo.push(sorted[(start + j) % n]);
                }
                combo.sort((a, b) => a - b);
                const key = combo.join(',');
                if (!usedSet.has(key)) {
                    usedSet.add(key);
                    combos.push(combo);
                }
                i++;

        // ========================================================================
        // 집합 계산기
        // ========================================================================
        function parseSet(input){ if(!input.trim()) return []; const cleaned=input.replace(/[^0-9,，\s]/g,''); return cleaned.split(/[,，\s]+/).map(s=>s.trim()).filter(s=>s!=='').map(Number).filter(n=>!isNaN(n)); }
        function getSets(){ return { A:parseSet(document.getElementById('setA').value), B:parseSet(document.getElementById('setB').value), C:parseSet(document.getElementById('setC').value) }; }
        function getMainBonus(){ return { main:parseSet(document.getElementById('mainNums').value), bonus:parseSet(document.getElementById('bonusNums').value) }; }
        function renderResult(numbers){ const container=document.getElementById('setResult'); const {main,bonus}=getMainBonus(); if(!numbers||numbers.length===0){ container.innerHTML=`<span class="placeholder">∅ (공집합)</span>`; return; } const sorted=[...numbers].sort((a,b)=>a-b); const chips=sorted.map(n=>{ let cls='num-chip'; if(main.includes(n)) cls+=' hit'; else if(bonus.includes(n)) cls+=' bonus'; return `<span class="${cls}">${n}</span>`; }).join(' '); container.innerHTML=chips; }
        function calcUnion(){ const {A,B,C}=getSets(); const result=[...new Set([...A,...B,...C])]; renderResult(result); }
        function calcIntersection(){ const {A,B,C}=getSets(); const sets=[A,B,C].filter(s=>s.length>0); if(sets.length===0){ renderResult([]); return; } let result=sets[0]; for(let i=1;i<sets.length;i++){ result=result.filter(n=>sets[i].includes(n)); } renderResult(result); }
        function calcDifference(){ const {A,B,C}=getSets(); const unionBC=new Set([...B,...C]); const result=A.filter(n=>!unionBC.has(n)); renderResult(result); }
        function calcSymmetricDifference(){ const {A,B,C}=getSets(); const all=new Set([...A,...B,...C]); const result=[]; for(const n of all){ let count=0; if(A.includes(n)) count++; if(B.includes(n)) count++; if(C.includes(n)) count++; if(count%2===1) result.push(n); } renderResult(result); }
        function resetSetCalc(){ document.getElementById('setA').value=''; document.getElementById('setB').value=''; document.getElementById('setC').value=''; document.getElementById('mainNums').value=''; document.getElementById('bonusNums').value=''; document.getElementById('setResult').innerHTML=`<span class="placeholder">📌 결과: 여기에 표시됩니다 (본:녹색 / 보너스:빨간색)</span>`; }
        function copySetResult(){ const container=document.getElementById('setResult'); const text=container.textContent.trim(); if(!text||text==='📌 결과: 여기에 표시됩니다 (본:녹색 / 보너스:빨간색)'||text==='∅ (공집합)'){ alert('복사할 결과가 없습니다.'); return; } navigator.clipboard.writeText(text).then(()=>{ alert('✅ 결과가 클립보드에 복사되었습니다!'); }).catch(()=>{ alert('복사에 실패했습니다. 수동으로 선택하여 복사해주세요.'); }); }

        window.onload=function(){
            syncStartRound();
            runAnalysis();
        };
