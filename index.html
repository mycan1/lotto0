        .filter-group { display: flex; flex-direction: column; gap: 3px; }
        .filter-group label { color: #ffd700; font-size: 12px; font-weight: bold; }
        .filter-group input, .filter-group select { padding: 6px 12px; border-radius: 8px; border: 1px solid #555; background: #2a2a2a; color: #fff; font-size: 14px; width: 100%; }
        .filter-group input[type="number"] { width: 100px; }
        button { background: #ffd700; color: #000; border: none; border-radius: 30px; padding: 8px 20px; font-weight: bold; font-size: 14px; cursor: pointer; transition: all 0.2s; }
        button:hover { background: #00e6b8; transform: scale(1.02); box-shadow: 0 0 20px #00e6b8; }
        .result-area { background: #1a1a1a; border: 2px solid #ffd700; border-radius: 15px; padding: 20px; margin-top: 20px; overflow-x: auto; }
        .loading { text-align: center; padding: 40px; color: #aaa; }
        .pattern-box { background: #0a1a2a; border: 2px solid #9b59b6; border-radius: 10px; padding: 12px 15px; margin: 10px 0; }
        .pattern-box .title { color: #9b59b6; font-weight: bold; font-size: 16px; }
        .pattern-item { margin: 5px 0; padding: 8px 12px; background: #1a1a2a; border-radius: 6px; border-left: 3px solid #f39c12; }
        .pattern-item .from { color: #f39c12; font-weight: bold; font-size: 18px; }
        .pattern-item .arrow { color: #888; }
        .pattern-item .to { color: #2ecc71; font-weight: bold; font-size: 18px; }
        .pattern-item .rate { color: #ffd700; font-size: 14px; }
        .pattern-item .count { color: #888; font-size: 12px; }
        .carryover-box { background: #1a2a1a; border: 2px solid #2ecc71; border-radius: 10px; padding: 12px 15px; margin: 10px 0; }
        .carryover-box .title { color: #2ecc71; font-weight: bold; font-size: 16px; }
        .carryover-number { display: inline-block; background: #2a2a2a; padding: 8px 15px; border-radius: 8px; margin: 3px; font-size: 24px; font-weight: bold; border: 2px solid #2ecc71; color: #2ecc71; }
        .carryover-number.high { border-color: #ff6b6b; color: #ff6b6b; }
        .carryover-number.mid { border-color: #ffd700; color: #ffd700; }
        .badge { display: inline-block; padding: 2px 10px; border-radius: 12px; font-size: 11px; font-weight: bold; margin-left: 5px; }
        .badge-high { background: #ff6b6b; color: #fff; }
        .badge-mid { background: #ffd700; color: #000; }
        .badge-low { background: #555; color: #fff; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 10px; margin: 10px 0; }
        .stats-item { background: #1a1a1a; padding: 10px; border-radius: 8px; text-align: center; border-left: 3px solid #ffd700; }
        .stats-item .value { font-size: 28px; font-weight: bold; color: #ffd700; }
        .stats-item .label { font-size: 12px; color: #888; }
        @media (max-width: 600px) { .filters { flex-direction: column; } }
    </style>

    function getWinning(round) {
        const row = DATA.find(r => r[0] === round);
        return row ? { main: row.slice(1, 7), bonus: row[7] } : null;
    }

    // ========================================================================
    // 🔥 이월수 패턴 분석 (직전 회차 → 다음 회차)
    // ========================================================================
    function analyzeCarryoverPattern(targetRound, startRound, minRate) {
        const prevWin = getWinning(targetRound - 1);
        if (!prevWin) return { error: '직전 회차 데이터 없음' };
        
        const prevNums = prevWin.main;
        const patternData = {};
        
        // 각 직전 번호별 패턴 초기화
        prevNums.forEach(prevNum => {
            patternData[prevNum] = {
                total: 0,
                carryovers: {}
            };
        });
        
        // 전체 데이터 순회
        for (let i = 0; i < DATA.length - 1; i++) {
            const current = DATA[i];
            const next = DATA[i + 1];
            const currentNums = current.slice(1, 7);
            const nextNums = next.slice(1, 7);
            const round = current[0];
            
            // 시작 회차 이후, 목표 회차 이전만 분석
            if (round < startRound || round >= targetRound) continue;
            
            // 직전 번호가 현재 회차에 있는지 확인
            prevNums.forEach(prevNum => {
                if (currentNums.includes(prevNum)) {
                    patternData[prevNum].total++;
                    
                    // 다음 회차에서 이월된 번호 기록
                    nextNums.forEach(nextNum => {
                        patternData[prevNum].carryovers[nextNum] = 
                            (patternData[prevNum].carryovers[nextNum] || 0) + 1;
                    });
                }
            });
        }
        
        // 결과 가공
        const result = {};
        const allCandidates = [];
        
        for (const [prevNum, data] of Object.entries(patternData)) {
            if (data.total === 0) continue;
            
            const sorted = Object.entries(data.carryovers)
                .sort((a, b) => b[1] - a[1])
                .map(([num, count]) => ({
                    num: parseInt(num),
                    count: count,
                    rate: Math.round((count / data.total) * 100)
                }))
                .filter(d => d.rate >= minRate);
            
            result[prevNum] = sorted;
            
            // 전체 후보에 추가
            sorted.forEach(d => {
                allCandidates.push({
                    from: parseInt(prevNum),
                    num: d.num,
                    rate: d.rate,
                    count: d.count
                });
            });
        }
        
        // 전체 후보 정렬 (확률 높은 순)
        allCandidates.sort((a, b) => b.rate - a.rate);
        
        // 중복 제거 (같은 번호는 가장 높은 확률만)
        const uniqueCandidates = [];
        const seenNums = new Set();
        for (const c of allCandidates) {
            if (!seenNums.has(c.num)) {
                seenNums.add(c.num);
                uniqueCandidates.push(c);
            }
        }
        
        return {
            patternData: result,
            candidates: uniqueCandidates.slice(0, 10),
            prevNums: prevNums
        };
    }

    function runCarryoverAnalysis() {
        const targetRound = parseInt(document.getElementById('targetRound').value) || 1235;
        const startRound = parseInt(document.getElementById('startRound').value) || 1000;
        const minRate = parseInt(document.getElementById('minRate').value) || 10;

        resultDiv.innerHTML = '<div class="loading">⏳ 분석 중...</div>';
        
        // 분석 실행
        const analysis = analyzeCarryoverPattern(targetRound, startRound, minRate);
        
        if (analysis.error) {
            resultDiv.innerHTML = `<div style="color:#ff6b6b; padding:20px;">⚠️ ${analysis.error}</div>`;
            return;
        }
        
        // 직전 회차 정보
        const prevWin = getWinning(targetRound - 1);
        const prevMain = prevWin ? prevWin.main : [];
        const prevBonus = prevWin ? prevWin.bonus : null;
        
        // HTML 생성
        let html = `
            <div style="margin-bottom:15px; padding:10px 15px; background:#2a1a2a; border-radius:10px; border-left:4px solid #ffd700;">
                <strong style="color:#ffd700;">📅 목표 회차: ${targetRound}</strong>
                <span style="color:#888; margin-left:15px;">직전 회차: ${targetRound - 1}</span>
                <span style="color:#f39c12; margin-left:15px;">직전 당첨: ${prevMain.join(', ')}</span>
                ${prevBonus ? `<span style="color:#ff6b6b; margin-left:10px;">보너스: ${prevBonus}</span>` : ''}
            </div>
        `;
        
        // 통계
        let totalCases = 0;
        let totalMatches = 0;
        for (const [prevNum, data] of Object.entries(analysis.patternData)) {
            totalCases += data.length;
            data.forEach(d => totalMatches += d.count);
        }
        
        html += `
            <div class="stats-grid">
                <div class="stats-item"><div class="value">${analysis.candidates.length}</div><div class="label">🎯 이월 후보</div></div>
                <div class="stats-item"><div class="value">${totalCases}</div><div class="label">📊 패턴 케이스</div></div>
                <div class="stats-item"><div class="value">${totalMatches}</div><div class="label">📈 총 이월 횟수</div></div>
                <div class="stats-item"><div class="value">${Math.round(totalMatches / (totalCases || 1))}</div><div class="label">📊 평균 이월률</div></div>
            </div>
        `;
        
        // 패턴 분석 결과
        html += `<div class="pattern-box">
            <div class="title">📊 직전 번호별 이월 패턴 (최소 ${minRate}%)</div>`;
        
        for (const [prevNum, data] of Object.entries(analysis.patternData)) {
            if (data.length === 0) continue;
            
            html += `<div class="pattern-item">
                <span class="from">${prevNum}</span>
                <span class="arrow"> → </span>`;
            
            data.slice(0, 5).forEach((d, idx) => {
                const color = d.rate >= 30 ? '#ff6b6b' : (d.rate >= 20 ? '#ffd700' : '#2ecc71');
                html += `<span class="to" style="color:${color};">${d.num}</span>
                         <span class="rate">(${d.rate}%, ${d.count}회)</span>`;
                if (idx < data.length - 1 && idx < 4) html += ` | `;
            });
            
            html += `</div>`;
        }
        html += `</div>`;
        
        // 🔥 최종 이월수 후보
        const topCandidates = analysis.candidates.slice(0, 5);
        const highCandidates = analysis.candidates.filter(c => c.rate >= 30);
        const midCandidates = analysis.candidates.filter(c => c.rate >= 20 && c.rate < 30);
        const lowCandidates = analysis.candidates.filter(c => c.rate >= 10 && c.rate < 20);
        
        html += `<div class="carryover-box">
            <div class="title">🔥 이월수 최종 후보 (확률순)</div>
            <div style="margin-top:10px;">`;
        
        // 높은 확률 (30% 이상)
        if (highCandidates.length > 0) {
            html += `<div style="margin:5px 0;">
                <span class="badge badge-high">🔴 30%+</span> `;
            highCandidates.forEach(c => {
                html += `<span class="carryover-number high">${c.num}</span> `;
            });
            html += `</div>`;
        }
        
        // 중간 확률 (20~29%)
        if (midCandidates.length > 0) {
            html += `<div style="margin:5px 0;">
                <span class="badge badge-mid">🟡 20~29%</span> `;
            midCandidates.forEach(c => {
                html += `<span class="carryover-number mid">${c.num}</span> `;
            });
            html += `</div>`;
        }
        
        // 낮은 확률 (10~19%)
        if (lowCandidates.length > 0) {
            html += `<div style="margin:5px 0;">
                <span class="badge badge-low">🟢 10~19%</span> `;
            lowCandidates.forEach(c => {
                html += `<span class="carryover-number">${c.num}</span> `;
            });
            html += `</div>`;
        }
        
        html += `</div></div>`;
        
        // 상세 후보 목록
        html += `<div style="margin-top:10px; background:#1a1a1a; border-radius:8px; padding:10px; overflow-x:auto;">
            <table style="width:100%; border-collapse: collapse; font-size:13px;">
                <thead>
                    <tr style="background:#333; color:#ffd700;">
                        <th style="padding:6px; text-align:center; border:1px solid #555;">순위</th>
                        <th style="padding:6px; text-align:center; border:1px solid #555;">이월 번호</th>
                        <th style="padding:6px; text-align:center; border:1px solid #555;">직전 번호</th>
                        <th style="padding:6px; text-align:center; border:1px solid #555;">이월률</th>
                        <th style="padding:6px; text-align:center; border:1px solid #555;">이월 횟수</th>
                        <th style="padding:6px; text-align:center; border:1px solid #555;">등급</th>
                    </tr>
                </thead>
                <tbody>`;
        
        analysis.candidates.forEach((c, idx) => {
            const grade = c.rate >= 30 ? '🔴 HIGH' : (c.rate >= 20 ? '🟡 MID' : '🟢 LOW');
            const color = c.rate >= 30 ? '#ff6b6b' : (c.rate >= 20 ? '#ffd700' : '#2ecc71');
            html += `<tr>
                <td style="padding:4px; text-align:center; border:1px solid #444; color:#888;">${idx + 1}</td>
                <td style="padding:4px; text-align:center; border:1px solid #444; font-weight:bold; font-size:18px; color:${color};">${c.num}</td>
                <td style="padding:4px; text-align:center; border:1px solid #444; color:#f39c12;">${c.from}</td>
                <td style="padding:4px; text-align:center; border:1px solid #444; color:#ffd700; font-weight:bold;">${c.rate}%</td>
                <td style="padding:4px; text-align:center; border:1px solid #444; color:#888;">${c.count}회</td>
                <td style="padding:4px; text-align:center; border:1px solid #444; color:${color};">${grade}</td>
            </tr>`;
        });
        
        html += `</tbody></table>
            <div style="font-size:11px; color:#888; margin-top:8px;">
                📌 분석 기준: 시작 ${startRound}회 ~ ${targetRound - 1}회 | 최소 이월률 ${minRate}%
            </div>
        </div>`;
        
        resultDiv.innerHTML = html;
    }

    // ========================================================================
    // window.onload
    // ========================================================================
    window.onload = function() {
        document.getElementById('targetRound').value = 1235;
        document.getElementById('startRound').value = 1000;
        document.getElementById('minRate').value = 10;
        document.getElementById('resultArea').innerHTML = 
            '<div class="loading">🟢 "🔍 이월수 분석 실행" 버튼을 눌러주세요.</div>';
        console.log('🟢 이월수 패턴 분석기 로드 완료');
    };
    </script>
</body>
</html>
